
version: 3

dotenv: [ '.env' ]

tasks:

    build:
        desc: 'OwnCloud Infinite Scale'
        silent: true
        vars:
            OCIS_VERSION:
                sh: git ls-remote --tags {{.OCIS_SOURCE}} | grep -E 'refs/tags/v[0-9]+\.' | sed -E 's|.*refs/tags/(v[0-9]+(\.[0-9]+)+)$|\1|' | grep -vE '(-rc|-dev)' | sort -V | tail -n 1 | sed 's/v//'
        cmds:
            - echo -e '\e[44;1m[ Building OwnCloud Infinite Scale ]\e[0;0m'
            - sed -i '/OCIS_VERSION=/d' .env
            - echo "OCIS_VERSION={{.OCIS_VERSION}}" >> .env
            - docker compose build --push
            - sed -i '/OCIS_VERSION=/d' .env
            - echo "[ Done ]"

    checkout:
        silent: true
        vars:
            OCIS_VERSION:
                sh: git ls-remote --tags {{.OCIS_SOURCE}} | grep -E 'refs/tags/v[0-9]+\.' | sed -E 's|.*refs/tags/(v[0-9]+(\.[0-9]+)+)$|\1|' | grep -vE '(-rc|-dev)' | sort -V | tail -n 1 | sed 's/v//'
        cmds:
            - echo "{{.OCIS_VERSION}}"

    default:
        silent: true
        cmds:
            - task -l
